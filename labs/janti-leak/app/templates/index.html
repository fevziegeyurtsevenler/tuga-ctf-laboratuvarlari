<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotifly - JANTİ Leak Station</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .player-card {
            background-color: #181818;
            border-radius: 12px;
            padding: 32px;
            width: 380px;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        .album-art {
            width: 100%;
            height: 260px;
            border-radius: 8px;
            background: linear-gradient(135deg, #1db954, #191414);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 24px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }
        .track-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .track-artist {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 24px;
        }
        audio {
            width: 100%;
            margin-bottom: 24px;
            filter: invert(1) hue-rotate(180deg);
        }
        .btn-download {
            display: inline-block;
            background-color: #1db954;
            color: #000000;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 500px;
            font-weight: 700;
            font-size: 14px;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-download:hover {
            background-color: #1ed760;
            transform: scale(1.04);
        }
        .hint-text {
            font-size: 11px;
            color: #666666;
            margin-top: 18px;
        }
    </style>
</head>
<body>
    <div class="player-card">
        <div class="album-art">JANTİ</div>
        <div class="track-title">{{ track.title }}</div>
        <div class="track-artist">{{ track.artist }} &bull; {{ track.album }}</div>
        
        <audio controls>
            <source src="{{ url_for('static', filename=track.audio_file) }}" type="audio/wav">
            Your browser does not support the audio tag.
        </audio>

        <a href="/download/audio" class="btn-download">Download Audio (FLAC/WAV Master)</a>

        <div class="hint-text">Forensics Warning: Unreleased pre-master track leaked from unknown studio session.</div>
    </div>
</body>
</html>
